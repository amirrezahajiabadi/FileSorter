<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>FileSorter</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/design-tokens.css">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="app">

  <div class="header">
    <div class="title">
      <h1>📁 FileSorter</h1>
      <span class="version" id="versionText">v...</span>
    </div>
    <div class="nav-row">
      <div class="nav-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</div>
      <div class="nav-btn" id="recentBtn" onclick="toggleRecentMenu()" title="Recent folders">🕘</div>
    </div>
  </div>

  <div id="recentMenu" class="card" style="display:none; margin-bottom:16px; padding:8px;"></div>

  <div class="drop-zone">
    <span class="path" id="folderPath">No folder selected</span>
    <button class="btn-primary" onclick="browseFolder()">Browse</button>
  </div>

  <div class="legend" id="categoryLegend"></div>

  <div class="sorting-line">
    <div class="label">Progress</div>
    <div class="track">
      <div class="fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-text">
      <span id="progressCount">Ready</span>
      <span id="progressPercent"></span>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="sortBtn" style="flex:1;" onclick="startSort()" disabled>
      ▶ Analyze &amp; Sort
    </button>
  </div>

  <div class="log" id="logArea">
    <div class="line"><span class="rest">Select a folder to get started.</span></div>
  </div>

</div>
<script src="js/app.js"></script>
</body>
</html>
