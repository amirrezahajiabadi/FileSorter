name: Build & Release

# Runs whenever a tag like v6.8.0 is pushed. The tag must match the version the
# app actually reports (checked below), because a release whose exe disagrees
# with its own tag is worse than no release at all.
on:
  push:
    tags:
      - "v*.*.*"

# Needed so this workflow is allowed to create a Release.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Check the version agrees everywhere
        # Fails on drift between package.json, tauri.conf.json and Cargo.toml,
        # and on a tag that doesn't match APP_VERSION — before ten minutes of
        # packaging produce an artefact nobody can name correctly.
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          "tag=$tag package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          if ($tag -ne $pkg -or $tag -ne $tauri -or $tag -ne $cargo) {
            throw "Version drift: tag v$tag, package.json $pkg, tauri.conf.json $tauri, Cargo.toml $cargo"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the Tauri app (installer + portable exe)
        run: npm run tauri build

      - name: Prepare release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-binaries
          Copy-Item src-tauri/target/release/filesorter2.exe -Destination "dist-binaries/FileSorter_Portable.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe -Destination "dist-binaries/FileSorter_Setup.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-binaries/FileSorter_Setup.exe
            dist-binaries/FileSorter_Portable.exe
          generate_release_notes: true
