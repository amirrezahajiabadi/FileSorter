name: Build & Release

# Runs whenever a tag like v6.1.2 is pushed. The tag must name the version the
# app actually reports (checked below), because a release whose exe disagrees
# with its own tag is worse than no release at all.
on:
  push:
    tags:
      - "v*.*.*"

# Needed so this workflow is allowed to create a Release.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest -v

      - name: Install app dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Check the version agrees everywhere
        # Fails on drift (package.json / installer.nsi / generated strings) and
        # on a tag that doesn't match APP_VERSION — before ten minutes of
        # packaging produce an artefact nobody can name correctly.
        run: python tools/check_version_consistency.py --tag "${{ github.ref_name }}"

      - name: Build the frozen app
        # FileSorter.spec is the only build recipe: it owns the hidden imports,
        # the bundled frontend, the icon and the version resource. Do not add a
        # second pyinstaller command line here — that is how the two drifted
        # apart in the first place.
        run: python -m PyInstaller --clean --noconfirm FileSorter.spec

      - name: Smoke-test the frozen build
        # Exercises the real executable: onedir layout, version resource, the
        # --autostart CLI and the headless JSON-RPC + SSE service. A missing
        # hidden import or an over-eager `excludes` dies here, not on a user's
        # machine.
        run: python tools/smoke_test_build.py

      - name: Package the onedir build
        shell: pwsh
        # onedir ships as a folder (exe + _internal/); zipping preserves the
        # relative layout the exe resolves its bundled files through.
        run: |
          Compress-Archive -Path dist/FileSorter/* -DestinationPath "dist/FileSorter-${{ github.ref_name }}-win64.zip" -Force

      - name: Create GitHub Release with the zip attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FileSorter-${{ github.ref_name }}-win64.zip
          generate_release_notes: true
